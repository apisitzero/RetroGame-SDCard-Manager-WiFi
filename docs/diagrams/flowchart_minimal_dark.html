<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcOS Wi-Fi Manager · Workflow Flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Prompt', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design (Minimal Dark)</p>
    <h1>ArcOS Wi-Fi Manager End-to-End Operational Workflow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc">
        <title id="flow-title">ArcOS Wi-Fi Manager Flowchart</title>
        <desc id="flow-desc">Operational flowchart showing R36S startup, web connection, license check, game management, and streaming ROM upload pipeline.</desc>
        
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.08)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#2d3142"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

        <!-- ================= Connectors (Z-order 1) ================= -->
        <!-- 1. Start -> Shell Launcher -->
        <line x1="500" y1="65" x2="500" y2="95" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 2. Shell -> TUI Start -->
        <line x1="500" y1="145" x2="500" y2="175" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 3. TUI -> Browser Connect -->
        <line x1="500" y1="225" x2="500" y2="255" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 4. Browser Connect -> Diamond 1 (License Check) -->
        <line x1="500" y1="305" x2="500" y2="335" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 5. Diamond 1 (FREE / NO) -> 4-Ad Box (Right) -->
        <path d="M 580,375 H 710" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 6. Diamond 1 (PRO / YES) -> Rejoin Dot (Down) -->
        <line x1="500" y1="415" x2="500" y2="465" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 7. 4-Ad Box -> Rejoin Dot -->
        <path d="M 800,415 V 455 Q 800,465 790,465 H 510" fill="none" stroke="#bfc0c0" stroke-width="1.1" marker-end="url(#arrow)"/>

        <!-- 8. Rejoin Dot -> Diamond 2 (User Action) -->
        <line x1="500" y1="465" x2="500" y2="495" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 9. Diamond 2 -> Action A: Manage Existing (Left) -->
        <path d="M 420,535 H 280 Q 272,535 272,543 V 565" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 10. Diamond 2 -> Action B: Upload ROM (Down - Happy Path) -->
        <line x1="500" y1="575" x2="500" y2="605" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 11. Upload Modal -> Streaming Upload -->
        <line x1="500" y1="655" x2="500" y2="685" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 12. Streaming Upload -> Disk Move & Sync -->
        <line x1="500" y1="735" x2="500" y2="765" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 13. Action A (Manage) -> Rejoin before Exit -->
        <path d="M 272,615 V 785 Q 272,795 282,795 H 410" fill="none" stroke="#bfc0c0" stroke-width="1.1" marker-end="url(#arrow)"/>

        <!-- 14. Action B (Disk Sync) -> Rejoin Dot -->
        <line x1="500" y1="815" x2="500" y2="835" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Connector Mask Labels -->
        <rect x="615" y="362" width="60" height="13" rx="2" fill="#2d3142"/>
        <text x="645" y="372" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">FREE TIER</text>

        <rect x="508" y="430" width="60" height="13" rx="2" fill="#2d3142"/>
        <text x="538" y="440" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">PRO / BYPASS</text>

        <rect x="305" y="522" width="85" height="13" rx="2" fill="#2d3142"/>
        <text x="347" y="532" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RENAME / COVER</text>

        <rect x="508" y="580" width="70" height="13" rx="2" fill="#2d3142"/>
        <text x="543" y="590" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPLOAD ROM</text>

        <!-- ================= Nodes (Z-order 2) ================= -->
        <!-- 1. Start Node (Oval) -->
        <rect x="390" y="25" width="220" height="40" rx="20"
              fill="#393e53" stroke="rgba(245,245,245,0.25)" stroke-width="1"/>
        <text x="500" y="50" fill="#f5f5f5" font-size="12" font-weight="600" text-anchor="middle">Start: Open Ports on R36S</text>

        <!-- 2. Step: Launcher Script -->
        <rect x="330" y="95" width="340" height="50" rx="6"
              fill="#393e53" stroke="rgba(245,245,245,0.20)" stroke-width="1"/>
        <text x="500" y="117" fill="#f5f5f5" font-size="11" font-weight="600" text-anchor="middle">Ball Mod Thai Game WiFi Manager.sh</text>
        <text x="500" y="133" fill="#bfc0c0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Detect WiFi IP · Init Python Environment</text>

        <!-- 3. Step: Server & TUI -->
        <rect x="350" y="175" width="300" height="50" rx="6"
              fill="#393e53" stroke="rgba(245,245,245,0.20)" stroke-width="1"/>
        <text x="500" y="197" fill="#f5f5f5" font-size="11.5" font-weight="600" text-anchor="middle">Launch HTTP Server & TUI</text>
        <text x="500" y="213" fill="#bfc0c0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Display IP:8080 · ASCII "เล่าเรื่องเกม"</text>

        <!-- 4. Step: User Browser Connect -->
        <rect x="360" y="255" width="280" height="50" rx="6"
              fill="#393e53" stroke="rgba(245,245,245,0.20)" stroke-width="1"/>
        <text x="500" y="277" fill="#f5f5f5" font-size="11.5" font-weight="600" text-anchor="middle">Open Browser on Mobile / PC</text>
        <text x="500" y="293" fill="#bfc0c0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Navigate to http://&lt;R36S_IP&gt;:8080</text>

        <!-- 5. Decision 1: License Gate (Diamond) -->
        <polygon points="500,335 580,375 500,415 420,375"
                 fill="#393e53" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="500" y="372" fill="#f5f5f5" font-size="10.5" font-weight="600" text-anchor="middle">License Valid?</text>
        <text x="500" y="386" fill="#bfc0c0" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">MAC Key Verification</text>

        <!-- 5.1 Free Path: 4-Ad Support Modal -->
        <rect x="710" y="345" width="180" height="60" rx="6"
              fill="#393e53" stroke="rgba(245,245,245,0.18)" stroke-width="1"/>
        <text x="800" y="370" fill="#f5f5f5" font-size="11" font-weight="600" text-anchor="middle">4-Ad Support Overlay</text>
        <text x="800" y="387" fill="#bfc0c0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">20-second Sponsor Timer</text>

        <!-- Merge Dot 1 -->
        <circle cx="500" cy="465" r="4" fill="#bfc0c0"/>

        <!-- 6. Decision 2: Action Dispatcher (Diamond) -->
        <polygon points="500,495 580,535 500,575 420,535"
                 fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.4"/>
        <text x="500" y="532" fill="#f5f5f5" font-size="11" font-weight="600" text-anchor="middle">Action Type?</text>
        <text x="500" y="546" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Manage vs New Upload</text>

        <!-- 6.1 Action A: Existing Game Operations -->
        <rect x="180" y="565" width="185" height="50" rx="6"
              fill="#393e53" stroke="rgba(245,245,245,0.20)" stroke-width="1"/>
        <text x="272" y="587" fill="#f5f5f5" font-size="11" font-weight="600" text-anchor="middle">Rename / Cover Update</text>
        <text x="272" y="603" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Token Lookup · Update gamelist.xml</text>

        <!-- 6.2 Action B: Upload Modal (FOCAL STEP) -->
        <rect x="360" y="605" width="280" height="50" rx="6"
              fill="#393e53" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="500" y="627" fill="#f5f5f5" font-size="11.5" font-weight="600" text-anchor="middle">Multi-ROM Review & Boxart</text>
        <text x="500" y="643" fill="#6a95d8" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Libretro Scraper Match / Custom Cover</text>

        <!-- 7. Streaming Upload Step -->
        <rect x="340" y="685" width="320" height="50" rx="6"
              fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1.5"/>
        <text x="500" y="707" fill="#f5f5f5" font-size="12" font-weight="600" text-anchor="middle">Streaming Chunked Upload (64KB)</text>
        <text x="500" y="723" fill="#f08a59" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Stream directly to /roms/.tmp_uploads · No RAM Spike</text>

        <!-- 8. Atomic Move & XML Sync -->
        <rect x="350" y="765" width="300" height="50" rx="6"
              fill="#393e53" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="500" y="787" fill="#f5f5f5" font-size="11.5" font-weight="600" text-anchor="middle">Atomic Move & Metadata Sync</text>
        <text x="500" y="803" fill="#bfc0c0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Instant shutil.move() · Update gamelist.xml</text>

        <!-- Merge Dot 2 / End -->
        <circle cx="500" cy="835" r="4" fill="#bfc0c0"/>

      </svg>
    </div>
  </div>
</body>
</html>
