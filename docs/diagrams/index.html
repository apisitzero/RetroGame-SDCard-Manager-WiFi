<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcOS Wi-Fi Manager · Editorial Diagrams</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', 'Prompt', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      padding: 2.5rem 2rem;
    }

    .container { max-width: 1200px; margin: 0 auto; }
    
    .nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(245,245,245,0.12);
      padding-bottom: 1rem;
    }

    .nav button {
      background: #393e53;
      border: 1px solid rgba(245,245,245,0.20);
      color: #f5f5f5;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav button.active {
      background: rgba(240,138,89,0.18);
      border-color: #f08a59;
      color: #f08a59;
    }

    iframe {
      width: 100%;
      height: 900px;
      border: 1px solid rgba(245,245,245,0.12);
      border-radius: 8px;
      background: #2d3142;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <span style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-muted); letter-spacing: 0.1em; text-transform: uppercase;">ArcOS Wi-Fi Manager · Diagram Design</span>
      <div style="flex: 1;"></div>
      <button class="active" onclick="switchDiagram('architecture')">1. System Architecture (Minimal Dark)</button>
      <button onclick="switchDiagram('flowchart')">2. Operational Flowchart (Minimal Dark)</button>
    </div>

    <iframe id="diagramFrame" src="architecture_minimal_dark.html"></iframe>
  </div>

  <script>
    function switchDiagram(type) {
      const frame = document.getElementById('diagramFrame');
      const buttons = document.querySelectorAll('.nav button');
      buttons.forEach(b => b.classList.remove('active'));

      if (type === 'architecture') {
        frame.src = 'architecture_minimal_dark.html';
        buttons[0].classList.add('active');
      } else {
        frame.src = 'flowchart_minimal_dark.html';
        buttons[1].classList.add('active');
      }
    }
  </script>
</body>
</html>
